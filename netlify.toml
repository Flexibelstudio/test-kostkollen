# ===== Service Worker: se till att /sw.js inte fångas av SPA-redirecten =====
[[redirects]]
  from = "/sw.js"
  to = "/sw.js"
  status = 200
  force = true

# (Skyddsnät om någon kod fortfarande ropar på /service-worker.js)
[[redirects]]
  from = "/service-worker.js"
  to = "/sw.js"
  status = 200
  force = true

# Håll SW-filer färska
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# index.html ska alltid vara färsk
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# Extra-skydd för rot-URLen "/"
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# Hashade bundlade assets cacheas länge och är immutables
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Säkerhetsnät för filer i rot (om något hamnar där)
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ===== SPA-redirect (lägg sist så den inte fångar /sw.js) =====
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
