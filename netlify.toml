# ========= SW & cache-headrar =========

[[redirects]]
  from = "/sw.js"
  to   = "/sw.js"
  status = 200
  force = true

[[redirects]]
  from = "/service-worker.js"
  to   = "/sw.js"
  status = 200
  force = true

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200